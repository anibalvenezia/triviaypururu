<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Cargar preguntas · Trivia y Pururú</title>
</head>
<body>
<!-- Panel de carga de preguntas (Decap CMS). La configuración, config.yml, se genera
     en cada build desde data/categorias.json: ver scripts/generar-panel.mjs -->
<script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"></script>
<!-- Vista previa de las preguntas: ver admin/preview.js -->
<script src="/admin/preview.js"></script>
<!-- Enlace para abrir el pull request con todas las preguntas cargadas (carga-en-lotes → testing).
     Decap 3.8 no trae API para enlaces propios, así que es un botón fijo fuera de su interfaz. -->
<style>
  #abrir-pr-tanda { position: fixed; left: 16px; bottom: 16px; z-index: 9999; padding: 10px 14px;
    background: #1d6b4f; color: #fff; font: 600 14px/1.2 system-ui, sans-serif; text-decoration: none;
    border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #abrir-pr-tanda:hover { background: #15533d; }
</style>
<a id="abrir-pr-tanda" target="_blank" rel="noopener"
   href="https://github.com/anibalvenezia/triviaypururu/compare/testing...carga-en-lotes?expand=1&title=Tanda%20de%20preguntas">
  Terminé la tanda: abrir pull request
</a>
</body>
</html>
